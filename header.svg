<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Santiago Vera, Full-Stack Software Engineer">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#0077B5"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: 'SF Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
    .name { font-size: 56px; font-weight: 700; fill: #f0f6fc; }
    .role { font-size: 26px; fill: #C084FC; }
    .stack { font-size: 17px; fill: #8b949e; letter-spacing: 0.5px; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <rect x="1" y="1" width="898" height="238" rx="18" fill="url(#card)" stroke="#30363d" stroke-width="2"/>

  <!-- Pixel mark inspired by the GitHub avatar -->
  <g>
    <rect x="64"  y="44"  width="28" height="28" rx="4" fill="#A855F7"/>
    <rect x="96"  y="44"  width="28" height="28" rx="4" fill="#C084FC"/>
    <rect x="160" y="44"  width="28" height="28" rx="4" fill="#C084FC"/>
    <rect x="192" y="44"  width="28" height="28" rx="4" fill="#A855F7"/>

    <rect x="96"  y="76"  width="28" height="28" rx="4" fill="#A855F7"/>
    <rect x="128" y="76"  width="28" height="28" rx="4" fill="#7E22CE"/>
    <rect x="160" y="76"  width="28" height="28" rx="4" fill="#A855F7"/>

    <rect x="96"  y="108" width="28" height="28" rx="4" fill="#7E22CE"/>
    <rect x="128" y="108" width="28" height="28" rx="4" fill="#A855F7">
      <animate attributeName="opacity" values="1;0.45;1" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="160" y="108" width="28" height="28" rx="4" fill="#7E22CE"/>

    <rect x="64"  y="140" width="28" height="28" rx="4" fill="#A855F7"/>
    <rect x="128" y="140" width="28" height="28" rx="4" fill="#C084FC"/>
    <rect x="192" y="140" width="28" height="28" rx="4" fill="#A855F7"/>

    <rect x="64"  y="172" width="28" height="28" rx="4" fill="#C084FC"/>
    <rect x="128" y="172" width="28" height="28" rx="4" fill="#A855F7">
      <animate attributeName="opacity" values="1;0.5;1" dur="3s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="192" y="172" width="28" height="28" rx="4" fill="#C084FC"/>
  </g>

  <!-- Text -->
  <text x="270" y="104" class="mono name">Santiago Vera</text>
  <rect x="270" y="120" width="84" height="4" rx="2" fill="url(#accent)"/>
  <text x="270" y="160" class="mono role">Full-Stack Software Engineer<tspan class="blink">_</tspan></text>
  <text x="270" y="198" class="mono stack">Python · Django · React · TypeScript · Flutter</text>

  <!-- Faded pixels on the right -->
  <g fill="#A855F7">
    <rect x="800" y="44"  width="28" height="28" rx="4" opacity="0.10"/>
    <rect x="832" y="76"  width="28" height="28" rx="4" opacity="0.18"/>
    <rect x="800" y="108" width="28" height="28" rx="4" opacity="0.28"/>
    <rect x="832" y="140" width="28" height="28" rx="4" opacity="0.18"/>
    <rect x="800" y="172" width="28" height="28" rx="4" opacity="0.22"/>
  </g>
</svg>
