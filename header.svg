<svg xmlns="http://www.w3.org/2000/svg" width="900" height="176" viewBox="0 0 900 176" role="img" aria-label="Santiago Vera, Full-Stack Software Engineer">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#0077B5"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: 'SF Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
    .name { font-size: 48px; font-weight: 700; fill: #f0f6fc; }
    .role { font-size: 22px; fill: #C084FC; }
    .stack { font-size: 15px; fill: #8b949e; letter-spacing: 0.5px; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <rect x="1" y="1" width="898" height="174" rx="16" fill="url(#card)" stroke="#30363d" stroke-width="2"/>

  <!-- Pixel mark inspired by the GitHub avatar -->
  <g>
    <rect x="64"  y="31"  width="19" height="19" rx="3" fill="#A855F7"/>
    <rect x="88"  y="31"  width="19" height="19" rx="3" fill="#C084FC"/>
    <rect x="136" y="31"  width="19" height="19" rx="3" fill="#C084FC"/>
    <rect x="160" y="31"  width="19" height="19" rx="3" fill="#A855F7"/>

    <rect x="88"  y="55"  width="19" height="19" rx="3" fill="#A855F7"/>
    <rect x="112" y="55"  width="19" height="19" rx="3" fill="#7E22CE"/>
    <rect x="136" y="55"  width="19" height="19" rx="3" fill="#A855F7"/>

    <rect x="88"  y="79"  width="19" height="19" rx="3" fill="#7E22CE"/>
    <rect x="112" y="79"  width="19" height="19" rx="3" fill="#A855F7">
      <animate attributeName="opacity" values="1;0.45;1" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="136" y="79"  width="19" height="19" rx="3" fill="#7E22CE"/>

    <rect x="64"  y="103" width="19" height="19" rx="3" fill="#A855F7"/>
    <rect x="112" y="103" width="19" height="19" rx="3" fill="#C084FC"/>
    <rect x="160" y="103" width="19" height="19" rx="3" fill="#A855F7"/>

    <rect x="64"  y="127" width="19" height="19" rx="3" fill="#C084FC"/>
    <rect x="112" y="127" width="19" height="19" rx="3" fill="#A855F7">
      <animate attributeName="opacity" values="1;0.5;1" dur="3s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="160" y="127" width="19" height="19" rx="3" fill="#C084FC"/>
  </g>

  <!-- Text -->
  <text x="220" y="66" class="mono name">Santiago Vera</text>
  <rect x="220" y="82" width="64" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="220" y="118" class="mono role">Full-Stack Software Engineer<tspan class="blink">_</tspan></text>
  <text x="220" y="146" class="mono stack">Python · Django · React · TypeScript · Flutter</text>

  <!-- Faded pixels on the right -->
  <g fill="#A855F7">
    <rect x="792" y="31"  width="19" height="19" rx="3" opacity="0.10"/>
    <rect x="816" y="55"  width="19" height="19" rx="3" opacity="0.18"/>
    <rect x="792" y="79"  width="19" height="19" rx="3" opacity="0.28"/>
    <rect x="816" y="103" width="19" height="19" rx="3" opacity="0.18"/>
    <rect x="792" y="127" width="19" height="19" rx="3" opacity="0.22"/>
  </g>
</svg>
